version: 1
labels:
  # --- by PR "Type of change" checklist ---
  - label: "feature"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Feature\b'
  - label: "bug"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Bug fix\b'
  - label: "enhancement"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Enhancement\b'
  - label: "refactor"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Refactor\b'
  - label: "breaking-change"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Breaking change\b'
  - label: "security"
    body: '(?m)^\s*-\s*\[[xX]\]\s+\*\*Security\b'

  # --- by changed paths ---
  - label: "docs"
    files:
      - "^README\\.md$"
  - label: "ci-cd"
    files:
      - "^\\.github/"
  - label: "tests"
    files:
      - "^test/"
  - label: "dependencies"
    files:
      - "^pnpm-lock\\.yaml$"
  - label: "index"
    files:
      - "^src/index\\.ts$"
  - label: "upload"
    files:
      - "^src/routes/upload\\.ts$"
  - label: "cache"
    files:
      - "^src/edge-cache\\.ts$"
  - label: "auth"
    files:
      - "^src/auth\\.ts$"
  - label: "migrations"
    files:
      - "^migrations/"
